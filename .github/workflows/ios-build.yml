name: iOS Build Workflow

on:
  push:
    branches: "**"
  pull_request:
    branches: "**"

jobs:
  build:
    name: iOS IPA build
    runs-on: macos-15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Remove Unsupported Entitlements From Source
        run: |
          ENTITLEMENTS_FILE=$(find . -name "*.entitlements" | head -1)
          if [ -n "$ENTITLEMENTS_FILE" ]; then
            /usr/libexec/PlistBuddy -c "Delete :com.apple.developer.group-session" "$ENTITLEMENTS_FILE" 2>/dev/null || true
          fi

      - name: Patch App Group References
        run: |
          echo "=== Files referencing app group ==="
          grep -rn "group.Antoine-Bollengier.Atwy" . --include="*.swift" || echo "No references found"
          echo "==================================="
          
          find . -name "*.swift" -exec sed -i '' \
            's/UserDefaults(suiteName: "group.Antoine-Bollengier.Atwy")!/UserDefaults(suiteName: "group.Antoine-Bollengier.Atwy") ?? UserDefaults.standard/g' {} +
          
          find . -name "*.swift" -exec sed -i '' \
            's/FileManager.default.containerURL(forSecurityApplicationGroupIdentifier: "group.Antoine-Bollengier.Atwy")!/FileManager.default.urls(for: .documentDirectory, in: .userDomainMask).first!/g' {} +

      - name: Build Atwy
        run: xcodebuild -project Atwy.xcodeproj -scheme Atwy -archivePath build/Atwy.xcarchive archive CODE_SIGNING_ALLOWED="NO"

      - name: Create IPA
        run: |
          mkdir build/Payload && mv build/Atwy.xcarchive/Products/Applications/Atwy.app build/Payload/Atwy.app && cd build && zip -r Atwy.zip Payload/Atwy.app && mv Atwy.zip Atwy.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: IPA
          path: build/*.ipa
