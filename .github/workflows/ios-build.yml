name: Build Atwy IPA

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build IPA
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app

      - name: Build
        run: |
          xcodebuild -project Atwy.xcodeproj \
                     -scheme Atwy \
                     -configuration Debug \
                     -sdk iphoneos \
                     -arch arm64 \
                     -derivedDataPath build \
                     clean build \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     IPHONEOS_DEPLOYMENT_TARGET=17.0

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Debug-iphoneos/Atwy.app Payload/
          zip -r Atwy.ipa Payload/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Atwy-IPA
          path: Atwy.ipa
