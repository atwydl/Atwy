name: Build Atwy IPA

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build Unsigned IPA
    runs-on: macos-15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app
          xcodebuild -version

      - name: Build and Create IPA
        run: |
          # Build the app
          xcodebuild -project Atwy.xcodeproj \
                     -scheme Atwy \
                     -configuration Debug \
                     -derivedDataPath build \
                     -destination 'generic/platform=iOS' \
                     build \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO
          
          # Create Payload and copy app
          mkdir -p Payload
          cp -R build/Build/Products/Debug-iphoneos/Atwy.app Payload/
          
          # Create IPA
          zip -r Atwy.ipa Payload/

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Atwy-IPA
          path: Atwy.ipa
          retention-days: 30
