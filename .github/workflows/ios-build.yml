name: Build Atwy IPA for Real Device

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build Unsigned IPA for Real Device
    runs-on: macos-15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app
          xcodebuild -version

      - name: Clean Build
        run: |
          xcodebuild -project Atwy.xcodeproj \
                     -scheme Atwy \
                     -configuration Debug \
                     clean

      - name: Build Archive for Real Device
        run: |
          xcodebuild -project Atwy.xcodeproj \
                     -scheme Atwy \
                     -configuration Debug \
                     -sdk iphoneos \
                     -arch arm64 \
                     -archivePath build/Atwy.xcarchive \
                     archive \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     IPHONEOS_DEPLOYMENT_TARGET=17.0 \
                     ONLY_ACTIVE_ARCH=NO

      - name: Create IPA from Archive
        run: |
          if [ -d "build/Atwy.xcarchive/Products/Applications/Atwy.app" ]; then
            echo "Archive created successfully!"
            
            # Verify it's built for arm64
            file build/Atwy.xcarchive/Products/Applications/Atwy.app/Atwy
            
            mkdir -p Payload
            cp -R build/Atwy.xcarchive/Products/Applications/Atwy.app Payload/
            zip -r Atwy.ipa Payload/
          else
            echo "Archive creation failed!"
            find build -type d
            exit 1
          fi

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Atwy-IPA-RealDevice
          path: Atwy.ipa
          retention-days: 30
