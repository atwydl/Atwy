name: iOS Build Workflow
on:
  push:
    branches: "**"
  pull_request:
    branches: "**"

jobs:
  build:
    name: iOS IPA build
    runs-on: macos-15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Build Atwy (unsigned, device build)
        run: |
          xcodebuild \
            -project Atwy.xcodeproj \
            -scheme Atwy \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/Atwy.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED="NO" \
            CODE_SIGNING_REQUIRED="NO" \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED="NO" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -R build/Atwy.xcarchive/Products/Applications/Atwy.app build/Payload/Atwy.app
          cd build
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent Payload Atwy.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Atwy-unsigned-ipa
          path: build/Atwy.ipa

      - name: Upload dSYMs
        uses: actions/upload-artifact@v4
        with:
          name: Atwy-dSYMs
          path: build/Atwy.xcarchive/dSYMs
