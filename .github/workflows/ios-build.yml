name: Build Atwy IPA

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build Unsigned IPA
    runs-on: macos-15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app
          xcodebuild -version

      - name: List Available SDKs
        run: xcodebuild -showsdks

      - name: Build and Create IPA
        run: |
          # Build the app with explicit iOS SDK
          xcodebuild -project Atwy.xcodeproj \
                     -scheme Atwy \
                     -configuration Debug \
                     -sdk iphoneos \
                     -derivedDataPath build \
                     build \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     IPHONEOS_DEPLOYMENT_TARGET=17.0
          
          # Find and copy the app
          APP_PATH=$(find build/Build/Products -name "Atwy.app" -type d | head -1)
          echo "App found at: $APP_PATH"
          
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          
          # Create IPA
          zip -r Atwy.ipa Payload/

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Atwy-IPA
          path: Atwy.ipa
          retention-days: 30
