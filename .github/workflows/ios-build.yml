name: Build Atwy IPA

on:
  workflow_dispatch:
    # Manual trigger only
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build Unsigned IPA
    runs-on: macos-15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app
          xcodebuild -version

      - name: Resolve Swift Packages
        run: |
          xcodebuild -project Atwy.xcodeproj \
                     -scheme Atwy \
                     -resolvePackageDependencies

      - name: Build Unsigned App
        run: |
          xcodebuild -project Atwy.xcodeproj \
                     -scheme Atwy \
                     -configuration Debug \
                     -sdk iphoneos \
                     -derivedDataPath build \
                     clean build \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO

      - name: Create IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Debug-iphoneos/Atwy.app Payload/
          zip -r Atwy.ipa Payload/

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Atwy-IPA
          path: Atwy.ipa
          retention-days: 30
